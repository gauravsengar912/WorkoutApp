<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        textarea { width: 100%; height: 200px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .job { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        .score { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Job Resume Matching Dashboard</h1>
    <p>Paste your resume text below and click "Find Matches" to get job listings with matching scores.</p>
    <textarea id="resume" placeholder="Paste your resume here..."></textarea>
    <br><br>
    <button onclick="findMatches()">Find Matches</button>
    <div id="results"></div>

    <script>
        const jobs = [
            { title: "Software Engineer", company: "Tech Corp", description: "Develop software using JavaScript, Python.", link: "https://example.com/job1", keywords: ["javascript", "python", "software"] },
            { title: "Data Analyst", company: "Data Inc", description: "Analyze data with SQL, Excel.", link: "https://example.com/job2", keywords: ["sql", "excel", "data"] },
            { title: "Web Developer", company: "Web Ltd", description: "Build websites with HTML, CSS, JS.", link: "https://example.com/job3", keywords: ["html", "css", "javascript"] },
            // Add more jobs from different boards
        ];

        function findMatches() {
            const resumeText = document.getElementById('resume').value.toLowerCase();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            jobs.forEach(job => {
                let score = 0;
                job.keywords.forEach(keyword => {
                    if (resumeText.includes(keyword)) score += 20;
                });
                if (score > 0) {
                    const jobDiv = document.createElement('div');
                    jobDiv.className = 'job';
                    jobDiv.innerHTML = `
                        <h3>${job.title} at ${job.company}</h3>
                        <p>${job.description}</p>
                        <p class="score">Match Score: ${score}%</p>
                        <a href="${job.link}" target="_blank">Apply Here</a>
                    `;
                    resultsDiv.appendChild(jobDiv);
                }
            });

            if (resultsDiv.innerHTML === '') {
                resultsDiv.innerHTML = '<p>No matches found. Try updating your resume.</p>';
            }
        }
    </script>
</body>
</html>
